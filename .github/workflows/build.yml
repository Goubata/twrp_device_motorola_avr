name: Build TWRP (motorola avr / COS 17)

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_BRANCH:
        description: "TWRP manifest branch (TWRP-Test/platform_manifest_twrp_aosp)"
        required: true
        default: "twrp-16.0"
      USE_PINNED_MANIFEST:
        description: "Sync the exact source revisions in manifest-pinned.xml (last device-tested build) instead of the branch heads"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        # Keep disk-backed swap even when the runner has no zram module.
        swap-size-mb: 8192

    - name: Check out device tree
      uses: actions/checkout@v4
      with:
        path: device-tree

    - name: Validate COS KeyMint guard
      run: python3 device-tree/scripts/test-cos-keymint.py

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        key: twrp-avr-cos

    - name: Setup zram (fallback to regular disk swap)
      shell: bash
      run: |
        set -euo pipefail
        echo "Runner kernel: $(uname -r)"
        echo "Trying zram without installing kernel-specific packages..."
        zram_enabled=false
        if command -v zramctl >/dev/null 2>&1 && sudo modprobe zram 2>/dev/null; then
          # 90% of system RAM, matching the original zram configuration.
          zram_size_mib=$(awk '/^MemTotal:/ {printf "%d", $2 * 0.90 / 1024}' /proc/meminfo)
          zram_dev=''
          if zram_dev=$(sudo zramctl --find --size "${zram_size_mib}M" --algorithm lz4 2>/dev/null) && [ -n "$zram_dev" ]; then
            if sudo mkswap "$zram_dev" >/dev/null && sudo swapon --priority 1000 "$zram_dev"; then
              zram_enabled=true
              echo "zram enabled: $zram_dev (${zram_size_mib} MiB)"
            else
              echo "::warning::Could not activate $zram_dev; using disk-backed swap instead."
              sudo swapoff "$zram_dev" 2>/dev/null || true
              sudo zramctl --reset "$zram_dev" 2>/dev/null || true
            fi
          else
            echo "::notice::zram device allocation unavailable."
          fi
        else
          echo "::notice::zram module or zramctl is unavailable on this runner."
        fi

        if [ "$zram_enabled" != true ]; then
          echo "Using regular swap configured by maximize-build-space."
        fi
        swap_kib=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
        if [ "${swap_kib:-0}" -le 0 ]; then
          echo "::error::No active swap is available."
          exit 1
        fi
        swapon --show
        zramctl 2>/dev/null || true
        free -h
        df -h .

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y repo lz4 cpio binutils
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Sync source
      run: |
        repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        if [ "${{ github.event.inputs.USE_PINNED_MANIFEST }}" = true ]; then
          cp device-tree/manifest-pinned.xml .repo/manifests/avr-pinned.xml
          repo init -m avr-pinned.xml
        fi
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c --no-tags --no-clone-bundle -j$(nproc --all) || repo sync -c --no-tags --no-clone-bundle -j4
        kill $TIP_PID
        repo manifest -r -o manifest-pinned.xml
        df -h .

    - name: Setup device
      run: |
        mkdir -p device/motorola
        mv device-tree device/motorola/avr
        device/motorola/avr/scripts/apply-source-patches.sh .
        for v in AVR_OS_VERSION AVR_OS_PATCH AVR_VENDOR_PATCH; do
          val=$(sed -n "s/^$v := //p" device/motorola/avr/BoardConfig.mk)
          [ -n "$val" ] || { echo "$v not set"; exit 1; }
          echo "$v=$val" >> "$GITHUB_ENV"
        done

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch twrp_avr
        (while true; do echo "$(date +%T) Building TWRP..."; free -h | sed -n 2p; sleep 60; done) &
        TIP_PID=$!
        set -o pipefail
        m recoveryimage 2>&1 | tee build.log
        RC=$?
        kill $TIP_PID
        exit $RC

    - name: Verify and finalize
      run: |
        set -o pipefail
        OUT=out/target/product/avr
        mkdir -p release
        python3 device/motorola/avr/scripts/finalize-recovery.py \
          $OUT/recovery.img device/motorola/avr release/twrp-avr-cos-recovery.img \
          "$AVR_OS_VERSION" "$AVR_OS_PATCH" "$AVR_VENDOR_PATCH" \
          system/tools/mkbootimg | tee release/verify.log
        cd release
        sha256sum twrp-avr-cos-recovery.img > twrp-avr-cos-recovery.img.sha256
        cat twrp-avr-cos-recovery.img.sha256

    - name: Collect ramdisk listing
      if: always()
      run: |
        mkdir -p release
        OUT=out/target/product/avr
        cp manifest-pinned.xml release/ 2>/dev/null || true
        tail -n 400 build.log > release/build-tail.log 2>/dev/null || true
        if [ -d $OUT/recovery/root ]; then
          (cd $OUT/recovery/root && find . -printf '%M %u %s %p\n' | sort -k4) > release/ramdisk-files.txt
          cp $OUT/recovery/root/prop.default release/ 2>/dev/null || true
        fi

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: twrp-avr-cos-${{ github.run_number }}
        path: release/
        retention-days: 30
