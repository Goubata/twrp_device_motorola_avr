name: Build TWRP (motorola avr)

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_BRANCH:
        description: "TWRP manifest branch (TWRP-Test/platform_manifest_twrp_aosp)"
        required: true
        default: "twrp-16.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        swap-size-mb: 1024
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"
        remove-docker-images: "true"

    - name: Check out device tree
      uses: actions/checkout@v4
      with:
        path: device-tree

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        key: twrp-avr

    - name: Setup zram
      run: |
        sudo apt-get install -y linux-modules-extra-$(uname -r) zram-tools
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl
        free -h
        df -h .

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y repo lz4 cpio binutils
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Sync source
      run: |
        repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c --no-tags --no-clone-bundle -j$(nproc --all) || repo sync -c --no-tags --no-clone-bundle -j4
        kill $TIP_PID
        repo manifest -r -o manifest-pinned.xml
        df -h .

    - name: Setup device
      run: |
        mkdir -p device/motorola
        mv device-tree device/motorola/avr
        for v in AVR_OS_VERSION AVR_OS_PATCH AVR_VENDOR_PATCH; do
          val=$(sed -n "s/^$v := //p" device/motorola/avr/BoardConfig.mk)
          [ -n "$val" ] || { echo "$v not set"; exit 1; }
          echo "$v=$val" >> "$GITHUB_ENV"
        done

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch twrp_avr
        (while true; do echo "$(date +%T) Building TWRP..."; free -h | sed -n 2p; sleep 60; done) &
        TIP_PID=$!
        set -o pipefail
        m recoveryimage 2>&1 | tee build.log
        RC=$?
        kill $TIP_PID
        exit $RC

    - name: Verify and finalize
      run: |
        OUT=out/target/product/avr
        mkdir -p release
        python3 device/motorola/avr/scripts/finalize-recovery.py \
          $OUT/recovery.img device/motorola/avr release/twrp-avr-recovery.img \
          "$AVR_OS_VERSION" "$AVR_OS_PATCH" "$AVR_VENDOR_PATCH" \
          system/tools/mkbootimg | tee release/verify.log
        cd release
        sha256sum twrp-avr-recovery.img > twrp-avr-recovery.img.sha256
        cat twrp-avr-recovery.img.sha256

    - name: Collect ramdisk listing
      if: always()
      run: |
        mkdir -p release
        OUT=out/target/product/avr
        cp manifest-pinned.xml release/ 2>/dev/null || true
        tail -n 400 build.log > release/build-tail.log 2>/dev/null || true
        if [ -d $OUT/recovery/root ]; then
          (cd $OUT/recovery/root && find . -printf '%M %u %s %p\n' | sort -k4) > release/ramdisk-files.txt
          cp $OUT/recovery/root/prop.default release/ 2>/dev/null || true
        fi

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: twrp-avr-${{ github.run_number }}
        path: release/
        retention-days: 30
